<?xml version="1.0" encoding="UTF-8"?>
<!-- SYNTHETIC edge case, not a capture: hiding done through a stylesheet. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="200mm" height="200mm" viewBox="0 0 200 200">
  <style type="text/css">.hidden{display:none}.st0{fill:none;stroke:#000}</style>
  <rect id="ghost" class="hidden" width="30" height="30"/>
  <rect id="real" class="st0" y="40" width="100" height="50"/>
</svg>
