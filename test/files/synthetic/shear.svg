<?xml version="1.0" encoding="UTF-8"?>
<!-- SYNTHETIC edge case, not a capture: a skewed rect, whose box is oversized. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="200mm" height="200mm" viewBox="0 0 200 200">
  <g transform="skewX(20)"><rect id="skewed" width="100" height="50"/></g>
  <g transform="scale(2,1)"><rect id="stretched" y="80" width="50" height="50"/></g>
</svg>
