<?xml version="1.0" encoding="UTF-8"?>
<!-- SYNTHETIC edge case, not a capture: geometry we take unclipped. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="200mm" height="200mm" viewBox="0 0 200 200">
  <defs><clipPath id="cp"><rect width="50" height="50"/></clipPath></defs>
  <rect id="big" width="100" height="60" clip-path="url(#cp)"/>
</svg>
