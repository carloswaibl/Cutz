<?xml version="1.0" encoding="utf-8"?>
<!--
  REPRODUCTION, NOT A CAPTURE.

  Hand-written to reproduce the idioms Adobe Illustrator's SVG export emits -
  the generator comment, a `<style>` block of `.stN` classes, `_xHHHH_`-escaped
  ids, `XMLID_N_` ids, `enable-background` in the root style, px dimensions
  rather than physical ones, and `xml:space="preserve"`. It is not a file
  Illustrator produced. See docs/plan-m4.md PR 2.

  Drawing: drawer boxes at 96 px per inch, so px * 25.4/96 = mm.
    2 x side   400 x 150 px  =  105.8333 x 39.6875 mm
    1 x base   200 x 100 px  =   52.9167 x 26.4583 mm
-->
<!-- Generator: Adobe Illustrator 28.0.0, SVG Export Plug-In . SVG Version: 6.00 Build 0)  -->
<svg version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
	 x="0px" y="0px" width="720px" height="360px" viewBox="0 0 720 360"
	 style="enable-background:new 0 0 720 360;" xml:space="preserve">
<style type="text/css">
	.st0{fill:none;stroke:#000000;stroke-miterlimit:10;}
	.st1{display:none;}
	.st2{fill:none;stroke:#FF0000;stroke-width:0.5;}
</style>
<g id="Drawer_x20_Sides">
	<rect id="XMLID_1_" x="20" y="20" class="st0" width="400" height="150"/>
	<rect id="XMLID_2_" x="20" y="190" class="st0" width="400" height="150"/>
</g>
<rect id="_x31_8mm_x20_Base" x="460" y="20" class="st0" width="200" height="100"/>
<g id="Guides" class="st1">
	<line class="st2" x1="0" y1="180" x2="720" y2="180"/>
</g>
</svg>
