<?xml version="1.0" encoding="UTF-8"?>
<!--
  REPRODUCTION, NOT A CAPTURE.

  Hand-written to reproduce the idioms a Fusion sketch export emits - physical
  mm dimensions with a 1:1 viewBox, a y-flip matrix on the root group because
  CAD works y-up and SVG works y-down, unnamed paths with no ids at all, and
  profiles written as flat absolute M/L/A/Z compound paths. It is not a file
  Fusion produced. See docs/plan-m4.md PR 2.

  Drawing: two panels, 1mm per user unit. The y-flip is a mirror, not a shear,
  so nothing here should be reported as skewed.
    1 x panel  120 x 80  with a 30mm circular cutout
    1 x panel   60 x 40
-->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="300mm" height="200mm" viewBox="0 0 300 200">
  <g transform="matrix(1,0,0,-1,0,200)" fill="none" stroke="#000000" stroke-width="0.1">
    <path d="M 10 10 L 130 10 L 130 90 L 10 90 Z M 55 50 A 15 15 0 1 0 85 50 A 15 15 0 1 0 55 50 Z"/>
    <path d="M 150 10 L 210 10 L 210 50 L 150 50 Z"/>
  </g>
</svg>
