name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# PR runs are disposable, so a new push supersedes the old one. Runs on main
# gate the deploy, so they are left alone to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      # Also the source of the deployed artifact - the site is never built
      # separately from the build that CI verified.
      - name: Build
        run: npm run build

      - name: Upload site artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # Pages allows one live deployment at a time; a newer commit wins.
    concurrency:
      group: github-pages
      cancel-in-progress: true
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
